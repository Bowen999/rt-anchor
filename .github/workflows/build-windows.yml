name: Build Windows desktop app

# Builds the RT Anchor desktop app (RT Anchor Desktop/) for Windows with the
# same script a developer runs locally, build/windows/build_win.bat, smoke-tests
# the frozen exe, and on a v* tag attaches the zip to that tag's GitHub Release.
# Manual runs (workflow_dispatch) build + upload a workflow artifact only.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # required to upload assets to the Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build (venv + PyInstaller + zip)
        shell: cmd
        run: call "RT Anchor Desktop\build\windows\build_win.bat"

      - name: Self-test the frozen app
        shell: pwsh
        run: |
          # windowed exe: no console output, so judge it by its exit code
          $exe = (Resolve-Path "RT Anchor Desktop\dist\win\RT Anchor\RT Anchor.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru
          $null = $p.Handle   # keeps ExitCode readable after the process exits
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw 'selftest timed out' }
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          'selftest passed'

      - name: Name the zip + checksum
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "RT-Anchor-$ver-Windows-x64.zip"
          Move-Item "RT Anchor Desktop\dist\win\RT Anchor-win64.zip" $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() | Tee-Object -FilePath "$name.sha256.txt"
          "ASSET=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt-anchor-windows
          path: |
            RT-Anchor-*-Windows-x64.zip
            RT-Anchor-*-Windows-x64.zip.sha256.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256.txt
          fail_on_unmatched_files: true
