name: Tests

# Engine test suite (rt_anchor/tests) plus the desktop app's headless
# --selftest, on Linux, macOS and Windows. No GUI is ever launched: the
# selftest imports the app's Python side and runs a real calibration.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11']
        include:
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: rt_anchor/pyproject.toml

      - name: Install the engine (+ test extras)
        run: python -m pip install -e "rt_anchor[test,report]"

      - name: Engine tests
        working-directory: rt_anchor
        run: python -m pytest -q

      # The desktop app's non-GUI side: imports the JS bridge, runs a real
      # two-run calibration and builds the UI payload (see app.py _selftest).
      # pywebview only has to import; no window is created.
      - name: Install the desktop app's Python deps
        run: python -m pip install pywebview

      - name: Desktop app headless selftest
        working-directory: RT Anchor Desktop
        run: python app.py --selftest
