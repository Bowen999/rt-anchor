<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>RT Anchor - two rings, one anchor (circle)</title>
  <circle cx="512" cy="512" r="512" fill="#F5F1E8"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- shared track: the ring both scales stand on -->
    <circle cx="512" cy="512" r="249.6" stroke="#CFC7B8" stroke-width="16"/>
    <!-- reference axis (outer): 12 ticks, 2 ink majors + 10 warm-grey minors -->
    <g stroke="#CFC7B8" stroke-width="16">
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(30 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(60 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(90 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(120 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(150 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(210 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(240 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(270 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(300 512 512)"/>
      <line x1="512" y1="184" x2="512" y2="223.7" transform="rotate(330 512 512)"/>
    </g>
    <!-- alignment line (ink): outer major, then bridges to the anchor -->
    <g stroke="#1E2B33" stroke-width="32">
      <line x1="512" y1="192" x2="512" y2="242.6" transform="rotate(0 512 512)"/>
      <line x1="512" y1="192" x2="512" y2="242.6" transform="rotate(180 512 512)"/>
      <line x1="512" y1="242.6" x2="512" y2="276.5" transform="rotate(0 512 512)"/>
      <line x1="512" y1="321.3" x2="512" y2="385.3" transform="rotate(0 512 512)"/>
    </g>
    <!-- user column (inner): 9 sage ticks, smoothly uneven spacing, one tick on the 12 o'clock alignment -->
    <g stroke="#7FA88B" stroke-width="32">
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(0 512 512)"/>
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(37 512 512)"/>
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(74 512 512)"/>
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(113 512 512)"/>
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(157 512 512)"/>
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(203 512 512)"/>
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(247 512 512)"/>
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(286 512 512)"/>
      <line x1="512" y1="276.5" x2="512" y2="321.3" transform="rotate(323 512 512)"/>
    </g>
    <!-- anchor: shank, stock, arms (arc concentric with the rings) -->
    <g stroke="#1E2B33" stroke-width="32">
      <line x1="512" y1="385.3" x2="512" y2="644.5"/>
      <path d="M 399.7 582.2 A 132.5 132.5 0 0 0 624.3 582.2"/>
      <line x1="456.32" y1="439.04" x2="567.68" y2="439.04"/>
    </g>
    <!-- flukes -->
    <g fill="#1E2B33" stroke="#1E2B33" stroke-width="16">
      <polygon points="641.3,603.9 668.2,547.9 606.2,559"/>
      <polygon points="382.7,603.9 355.8,547.9 417.8,559"/>
    </g>
    <!-- the one accent: the pin where the two aligned ticks meet on the ring -->
    <circle cx="512" cy="262.4" r="28" fill="#E8794A" stroke="none"/>
  </g>
</svg>
