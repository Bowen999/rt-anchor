<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>RT Anchor - two rings, one anchor (square)</title>
  <rect width="1024" height="1024" rx="230" fill="#F5F1E8"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- shared track: the ring both scales stand on -->
    <circle cx="512" cy="512" r="260" stroke="#CFC7B8" stroke-width="16"/>
    <!-- reference axis (outer): 12 ticks, 2 ink majors + 10 warm-grey minors -->
    <g stroke="#CFC7B8" stroke-width="16">
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(30 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(60 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(90 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(120 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(150 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(210 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(240 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(270 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(300 512 512)"/>
      <line x1="512" y1="170" x2="512" y2="212" transform="rotate(330 512 512)"/>
    </g>
    <!-- alignment line (ink): outer major, then bridges to the anchor -->
    <g stroke="#1E2B33" stroke-width="32">
      <line x1="512" y1="178" x2="512" y2="232" transform="rotate(0 512 512)"/>
      <line x1="512" y1="178" x2="512" y2="232" transform="rotate(180 512 512)"/>
      <line x1="512" y1="232" x2="512" y2="266" transform="rotate(0 512 512)"/>
      <line x1="512" y1="314" x2="512" y2="380" transform="rotate(0 512 512)"/>
    </g>
    <!-- user column (inner): 9 sage ticks, smoothly uneven spacing, one tick on the 12 o'clock alignment -->
    <g stroke="#7FA88B" stroke-width="32">
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(0 512 512)"/>
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(37 512 512)"/>
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(74 512 512)"/>
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(113 512 512)"/>
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(157 512 512)"/>
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(203 512 512)"/>
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(247 512 512)"/>
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(286 512 512)"/>
      <line x1="512" y1="266" x2="512" y2="314" transform="rotate(323 512 512)"/>
    </g>
    <!-- anchor: shank, stock, arms (arc concentric with the rings) -->
    <g stroke="#1E2B33" stroke-width="32">
      <line x1="512" y1="380" x2="512" y2="650"/>
      <path d="M 395 585.1 A 138 138 0 0 0 629 585.1"/>
      <line x1="454" y1="436" x2="570" y2="436"/>
    </g>
    <!-- flukes -->
    <g fill="#1E2B33" stroke="#1E2B33" stroke-width="16">
      <polygon points="646.3,607.2 674.7,549.4 610.6,561.5"/>
      <polygon points="377.7,607.2 349.3,549.4 413.4,561.5"/>
    </g>
    <!-- the one accent: the pin where the two aligned ticks meet on the ring -->
    <circle cx="512" cy="252" r="28" fill="#E8794A" stroke="none"/>
  </g>
</svg>
