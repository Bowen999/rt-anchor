<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>RT Anchor - draft 2, Handheld (circle)</title>
  <defs>
    <!-- plastic body -->
    <radialGradient id="body" cx=".5" cy=".28" r=".85">
      <stop offset="0" stop-color="#ff6552"/>
      <stop offset=".5" stop-color="#ee2a2d"/>
      <stop offset="1" stop-color="#b3111e"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".22" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".78" stop-color="#3a0006" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a0006" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipBody"><circle cx="512" cy="512" r="512"/></clipPath>

    <!-- dome screen -->
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d0915"/>
      <stop offset="1" stop-color="#b3121f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2a38"/>
      <stop offset="1" stop-color="#081822"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".55">
      <stop offset="0" stop-color="#1c6a68" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1c6a68" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lcd" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0V8M0 8H8" stroke="#02121a" stroke-opacity=".34" stroke-width="2"/>
    </pattern>
    <clipPath id="clipScreen">
      <path d="M140 470A372 372 0 0 1 884 470V478Q884 490 872 490H152Q140 490 140 478Z"/>
    </clipPath>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#000" flood-opacity=".75"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feGaussianBlur stdDeviation="12"/>
      <feOffset dy="10" result="sh"/>
      <feComposite in="sh" in2="SourceAlpha" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh2"/></feMerge>
    </filter>
    <filter id="neon" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- hero button -->
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#d3c6b8"/>
    </linearGradient>
    <radialGradient id="cap" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#86e0ff"/>
      <stop offset=".5" stop-color="#2290f7"/>
      <stop offset="1" stop-color="#0a49be"/>
    </radialGradient>
    <radialGradient id="capLow" cx=".5" cy="1.05" r=".6">
      <stop offset="0" stop-color="#6ff0ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#6ff0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="0" y1="680" x2="0" y2="890">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3dfc2"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#2a0006" flood-opacity=".55"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>

    <!-- anchor (stroke/fill colour comes from <use>) -->
    <g id="anc" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="512" cy="708" r="19" fill="none" stroke-width="16"/>
      <path d="M512 727V874" fill="none" stroke-width="18"/>
      <path d="M470 757H554" fill="none" stroke-width="16"/>
      <path d="M428 800C432 856 474 878 512 878S592 856 596 800" fill="none" stroke-width="18"/>
      <path d="M424 772L396 814L448 820Z" stroke-width="8"/>
      <path d="M600 772L628 814L576 820Z" stroke-width="8"/>
    </g>

    <!-- LEDs -->
    <radialGradient id="ledY" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff7b8"/><stop offset=".5" stop-color="#ffd02a"/><stop offset="1" stop-color="#c78a00"/></radialGradient>
    <radialGradient id="ledG" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#d4ffd9"/><stop offset=".5" stop-color="#3ddc6f"/><stop offset="1" stop-color="#0d8f3d"/></radialGradient>
    <radialGradient id="ledC" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e2f9ff"/><stop offset=".5" stop-color="#58cfff"/><stop offset="1" stop-color="#1678c8"/></radialGradient>
  </defs>

  <!-- body -->
  <circle cx="512" cy="512" r="512" fill="url(#body)"/>
  <g clip-path="url(#clipBody)">
    <ellipse cx="512" cy="-90" rx="580" ry="400" fill="url(#gloss)"/>
  </g>
  <circle cx="512" cy="512" r="507" fill="none" stroke="url(#bevel)" stroke-width="10"/>

  <!-- dome screen well + screen -->
  <path d="M92 476A420 420 0 0 1 932 476V506Q932 546 892 546H132Q92 546 92 506Z" fill="#ff8a78" opacity=".55"/>
  <path d="M92 470A420 420 0 0 1 932 470V500Q932 540 892 540H132Q92 540 92 500Z" fill="url(#well)"/>
  <g filter="url(#inner)">
    <path d="M140 470A372 372 0 0 1 884 470V478Q884 490 872 490H152Q140 490 140 478Z" fill="url(#glass)"/>
  </g>
  <g clip-path="url(#clipScreen)">
    <rect x="140" y="98" width="744" height="392" fill="url(#glow)"/>
    <!-- alignment lines -->
    <path d="M380 168V454M512 168V454M644 168V454" stroke="#e8fff6" stroke-opacity=".8" stroke-width="6" stroke-dasharray="12 10"/>
    <!-- reference trace (top) -->
    <path filter="url(#neon)" fill="none" stroke="#7dffb4" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"
      d="M215 300H257C272.4 300 273.8 272 285 272C296.2 272 297.6 300 313 300H340C362 300 364 232 380 232C396 232 398 300 420 300H468C492.2 300 494.4 200 512 200C529.6 200 531.8 300 556 300H604C626 300 628 242 644 242C660 242 662 300 684 300H719C733.3 300 734.6 276 745 276C755.4 276 756.7 300 771 300H809"/>
    <!-- sample trace (bottom) -->
    <path filter="url(#neon)" fill="none" stroke="#ffc94d" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"
      d="M185 440H257C272.4 440 273.8 418 285 418C296.2 418 297.6 440 313 440H340C362 440 364 388 380 388C396 388 398 440 420 440H468C492.2 440 494.4 362 512 362C529.6 362 531.8 440 556 440H604C626 440 628 354 644 354C660 354 662 440 684 440H719C733.3 440 734.6 422 745 422C755.4 422 756.7 440 771 440H840"/>
    <!-- apex nodes -->
    <g fill="#fff">
      <circle cx="380" cy="232" r="10"/><circle cx="512" cy="200" r="10"/><circle cx="644" cy="242" r="10"/>
      <circle cx="380" cy="388" r="10"/><circle cx="512" cy="362" r="10"/><circle cx="644" cy="354" r="10"/>
    </g>
    <!-- time-axis ticks -->
    <path d="M190 472H834" stroke="#7dffb4" stroke-opacity=".5" stroke-width="9" stroke-dasharray="3 37"/>
    <!-- LCD dot grid + glass reflection -->
    <rect x="140" y="98" width="744" height="392" fill="url(#lcd)"/>
    <path d="M140 98H590L410 490H140Z" fill="#fff" opacity=".07"/>
  </g>

  <!-- LEDs -->
  <g>
    <g transform="translate(150 618)"><circle r="24" fill="#ff8a78" opacity=".5" cy="3"/><circle r="23" fill="#7a0a15"/><circle r="17" fill="url(#ledY)"/><ellipse cx="-5" cy="-7" rx="7" ry="4" fill="#fff" opacity=".8"/></g>
    <g transform="translate(212 618)"><circle r="24" fill="#ff8a78" opacity=".5" cy="3"/><circle r="23" fill="#7a0a15"/><circle r="17" fill="url(#ledG)"/><ellipse cx="-5" cy="-7" rx="7" ry="4" fill="#fff" opacity=".8"/></g>
    <g transform="translate(274 618)"><circle r="24" fill="#ff8a78" opacity=".5" cy="3"/><circle r="23" fill="#7a0a15"/><circle r="17" fill="url(#ledC)"/><ellipse cx="-5" cy="-7" rx="7" ry="4" fill="#fff" opacity=".8"/></g>
  </g>
  <!-- speaker slits -->
  <g stroke-linecap="round" stroke-width="14">
    <path d="M770 606H874M770 632H874M770 658H874" stroke="#ff8a78" stroke-opacity=".5" transform="translate(0 3)"/>
    <path d="M770 606H874M770 632H874M770 658H874" stroke="#7a0a15"/>
  </g>

  <!-- hero anchor button -->
  <g filter="url(#drop)">
    <circle cx="512" cy="784" r="200" fill="#ff8a78" opacity=".5" transform="translate(0 6)"/>
    <circle cx="512" cy="784" r="200" fill="#7a0a15"/>
  </g>
  <g filter="url(#drop)">
    <circle cx="512" cy="784" r="182" fill="url(#ring)"/>
  </g>
  <circle cx="512" cy="784" r="156" fill="#0a3a9a"/>
  <circle cx="512" cy="784" r="152" fill="url(#cap)"/>
  <circle cx="512" cy="784" r="152" fill="url(#capLow)"/>
  <ellipse cx="512" cy="712" rx="108" ry="60" fill="url(#capGloss)" opacity=".7"/>
  <!-- embossed anchor -->
  <g transform="translate(512 786) scale(1.13) translate(-512 -785)">
    <use xlink:href="#anc" fill="#0a3a9a" stroke="#0a3a9a" opacity=".5" transform="translate(0 7)" filter="url(#soft)"/>
    <use xlink:href="#anc" fill="#ffffff" stroke="#ffffff" opacity=".6" transform="translate(0 -3)"/>
    <use xlink:href="#anc" fill="url(#cream)" stroke="url(#cream)"/>
  </g>
</svg>
